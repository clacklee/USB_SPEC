# .github/workflows/download.yml
# .github/workflows/download.yml
name: Download External File
on: [push]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Create directory and download
        run: |
          mkdir -p ./附件          # 创建目录（-p 确保父目录也存在）
          wget -O ./附件/BCv1.2.zip https://www.usb.org/sites/default/files/BCv1.2_070312_0.zip
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add ./附件/BCv1.2.zip
          git commit -m "Add BC1.2 specification" || echo "No changes to commit"
          git push
