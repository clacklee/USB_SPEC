# .github/workflows/download.yml
name: Download USB BC1.2 Spec
on:
  workflow_dispatch:  # 手动触发

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Download BC1.2 specification
        run: |
          mkdir -p ./specs
          wget --timeout=30 --tries=3 \
            -O ./specs/BCv1.2.zip \
            https://www.usb.org/sites/default/files/BCv1.2_070312_0.zip
          ls -lh ./specs/  # 验证文件已下载
      
      - name: Unzip (optional)
        run: |
          cd ./specs
          unzip -o BCv1.2.zip
          rm BCv1.2.zip  # 可选：删除zip保留解压后的文件
      
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ./specs/
          git diff --staged --quiet || git commit -m "Download BC1.2 specification"
          git push
