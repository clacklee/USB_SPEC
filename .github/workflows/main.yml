# .github/workflows/download.yml
name: Download External File
on: [push]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Download file
        run: |
          wget -O ./附件/文件名.pdf https://www.usb.org/sites/default/files/BCv1.2_070312_0.zip
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git add ./附件/文件名.pdf
          git commit -m "Add downloaded file"
          git push
